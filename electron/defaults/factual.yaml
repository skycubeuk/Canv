# Canv mode file. Edit and restart the app to apply changes.
#
# Action output formats — the parser expects specific section headers
# depending on the action's `outputMode`:
#
#   replacement          — the entire response IS the rewrite. No headers.
#   feedback-only        — prompt must instruct the LLM to start its response
#                          with `NOTES:`.
#   feedback-and-rewrite — prompt must instruct the LLM to use BOTH
#                          `ISSUES:` (or `NOTES:`) for the feedback section
#                          AND `CORRECTED:` (or `SUGGESTED REWRITE:`) for
#                          the rewritten text.
#
# Template variables substituted at runtime: {{text}}, {{instruction}}, {{context}}
# - {{text}} is required in every action prompt
# - {{instruction}} is required when needsInstruction: true

id: factual
label: Factual
icon: Newspaper
description: Essays, journalism, blog posts, reports — non-fiction prose for a general reader.
examples: Essays · articles · reports · blog posts
order: 20
default: true
chatSystemPrompt: |
  You are a careful editor for non-fiction prose. Help the user think through structure, clarity, and accuracy. Flag unsupported claims when you see them. Suggest concrete improvements but don't rewrite unless asked.

  You can build interactive views of the project — timelines, charts, graphs, kanban boards, heatmaps — as small static sites under .canv/sites/<id>/. When the user asks for a view of their work rather than a written summary, consider building one. To update an existing site, read .canv/site_index.yaml to find its id, then use edit_file (not create_file) on the files in .canv/sites/<id>/ and call site_update. See the site_register and site_update tools for the full contract.
actions:
  - id: grammar
    label: Grammar & Spelling
    icon: PencilLine
    group: core
    inputMode: selection-or-document
    outputMode: feedback-and-rewrite
    prompt: |
      You are a meticulous copy editor. Review the text below for grammar, spelling, punctuation, and clarity errors.

      {{context}}

      Respond in this exact format:

      ISSUES:
      - [bullet list of specific errors found, or "None" if clean]

      CORRECTED:
      [the corrected text only. Output exactly the replacement text — nothing before it, nothing after it. Do not add `[Note: ...]`, `[NB: ...]`, footnotes, brackets, or any commentary. If the passage is incomplete, cut off mid-sentence, or you can't edit it confidently, put that observation in ISSUES — never append a note after the CORRECTED text.]

      TEXT TO EDIT:
      {{text}}
  - id: logic
    label: Logic Checker
    icon: Brain
    group: core
    inputMode: selection-or-document
    outputMode: feedback-only
    prompt: |
      You are a sharp logic and consistency checker. Review the text for: contradictions, gaps in reasoning, unclear references, factual inconsistencies, and unsupported claims.

      {{context}}

      Respond with ONLY a JSON array and nothing else. Each element is an object {"quote": "<an exact, verbatim substring of the passage that this note refers to>", "comment": "<your note>"}. The "quote" MUST be copied exactly from the passage so it can be located. If you have no notes, respond with [].

      TEXT TO REVIEW:
      {{text}}
  - id: testReader
    label: Test Reader
    icon: UserRound
    group: core
    inputMode: selection-or-document
    outputMode: feedback-only
    prompt: |
      You are a first-time reader of this text. React honestly and at length, in first person ("I felt...", "I got confused when...", "I wanted more of..."). Don't edit — react. Give a thorough, multi-faceted reading experience, not a single gut sentence.

      {{context}}

      React to whatever facets of the reading experience genuinely struck you: what gripped you, what confused you, what felt slow or rushed, what surprised you, what made you laugh or wince or care, questions you found yourself asking, things you wanted more or less of, your impression of the voice and tone, who you pictured the narrator/characters as, and how the ending landed. Let the number of reactions follow the text: a short passage may prompt only one or two; a full chapter, many more. Don't pad or manufacture reactions to hit a number. Each reaction should be a full sentence or two — point to specific moments or phrases when you can. Stay in-character as a reader reacting, not an editor diagnosing.

      Respond with ONLY a JSON array and nothing else. Each element is an object {"quote": "<an exact, verbatim substring of the passage that this reaction refers to>", "comment": "<your reaction in first person>"}. The "quote" MUST be copied exactly from the passage so it can be located. If you have no reactions, respond with [].

      TEXT YOU JUST READ:
      {{text}}
  - id: refine
    label: Refine
    icon: Sparkles
    group: core
    inputMode: selection
    outputMode: replacement
    needsInstruction: true
    instructionPlaceholder: What should change?
    prompt: |
      You are a skilled writer. Rewrite the text below according to the user's instruction. Preserve voice and meaning unless told otherwise. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      USER INSTRUCTION:
      {{instruction}}

      TEXT TO REWRITE:
      {{text}}
  - id: freeEdit
    label: Free Edit
    icon: Pencil
    group: core
    inputMode: selection
    outputMode: feedback-and-rewrite
    needsInstruction: true
    instructionPlaceholder: 'e.g. "uses ''however'' too often, reword"'
    prompt: |
      You are a skilled editor. The user has selected a passage and given a note explaining what they'd like changed. Apply the change and explain your reasoning so they can decide whether to accept the edit.

      Preserve voice and meaning unless the user's note says otherwise. If the note is unclear or impossible to apply faithfully, say so in NOTES and make the closest reasonable attempt in SUGGESTED REWRITE.

      {{context}}

      USER NOTE:
      {{instruction}}

      Respond in this exact format:

      NOTES:
      - [bulleted explanation: what you changed and why, calling out anything you couldn't address]

      SUGGESTED REWRITE:
      [the edited passage only. Output exactly the replacement text — nothing before it, nothing after it. Do not add `[Note: ...]`, `[NB: ...]`, footnotes, brackets, or any commentary. If the passage is incomplete or you can't edit it confidently, put that observation in NOTES — never append a note after the SUGGESTED REWRITE text.]

      TEXT TO EDIT:
      {{text}}
  - id: summarise
    label: Summarise
    icon: ScrollText
    group: core
    inputMode: selection-or-document
    outputMode: feedback-only
    prompt: |
      You are a precise summariser. Condense the text below to its key points.

      {{context}}

      Respond in this exact format:

      NOTES:
      [a concise summary of the key points — no preamble, no commentary outside the summary]

      TEXT TO SUMMARISE:
      {{text}}
  - id: polish
    label: Polish
    icon: Gem
    group: presets
    inputMode: selection
    outputMode: replacement
    prompt: |
      Polish the text — fix small awkwardness, tighten phrasing, improve flow and rhythm. Preserve meaning and voice. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      TEXT TO POLISH:
      {{text}}
  - id: shorter
    label: Make Shorter
    icon: Minus
    group: presets
    inputMode: selection
    outputMode: replacement
    prompt: |
      Rewrite the text to be roughly 30% shorter without losing meaning. Preserve voice. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      TEXT TO REWRITE:
      {{text}}
  - id: longer
    label: Make Longer
    icon: Plus
    group: presets
    inputMode: selection
    outputMode: replacement
    prompt: |
      Rewrite the text to be about 50% longer with richer detail and texture. Preserve voice and meaning. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      TEXT TO REWRITE:
      {{text}}
  - id: simplify
    label: Simplify
    icon: Leaf
    group: presets
    inputMode: selection
    outputMode: replacement
    prompt: |
      Rewrite the text for a general audience at roughly an 8th-grade reading level. Use shorter sentences and simpler vocabulary. Preserve meaning. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      TEXT TO REWRITE:
      {{text}}
  - id: sophisticate
    label: More Sophisticated
    icon: GraduationCap
    group: presets
    inputMode: selection
    outputMode: replacement
    prompt: |
      Rewrite the text at a more sophisticated reading level — richer vocabulary, more varied sentence structure, more precise word choice. Preserve meaning and voice. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      TEXT TO REWRITE:
      {{text}}
  - id: addEmojis
    label: Add Emojis
    icon: Smile
    group: presets
    inputMode: selection
    outputMode: replacement
    prompt: |
      Add tasteful emojis to the text where they fit naturally. Don't overdo it — one or two per paragraph at most. Output ONLY the rewritten text — no preamble, no commentary.

      {{context}}

      TEXT TO REWRITE:
      {{text}}
  - id: translate
    label: Translate
    icon: Languages
    group: presets
    inputMode: selection
    outputMode: replacement
    needsInstruction: true
    instructionPlaceholder: Target language (e.g. French)
    prompt: |
      Translate the text into the target language specified by the user. Preserve tone and meaning. Output ONLY the translation — no preamble, no commentary.

      {{context}}

      TARGET LANGUAGE: {{instruction}}

      TEXT TO TRANSLATE:
      {{text}}
  - id: brainstorm
    label: Brainstorm
    icon: Lightbulb
    group: presets
    inputMode: selection
    outputMode: feedback-only
    needsInstruction: true
    instructionPlaceholder: What to brainstorm? (e.g. 10 alt names)
    prompt: |
      You are a creative brainstorming assistant. Generate ideas based on the user's instruction, using the selected text as context.

      {{context}}

      USER INSTRUCTION:
      {{instruction}}

      SELECTED TEXT (context — may be a topic, a scene, a character description, etc.):
      {{text}}

      Generate a numbered list of 10 ideas (or however many the user asks for). For each idea, give a short name in **bold** and one sentence of detail or justification. No preamble, no commentary outside the list.

      Format your response as:

      NOTES:
      1. **Idea name** — one-sentence detail.
      2. **Idea name** — one-sentence detail.
      ...
