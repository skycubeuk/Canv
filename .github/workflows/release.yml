name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (AppImage, deb, rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build and publish Linux artifacts
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    name: macOS (dmg × x64+arm64)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build and publish macOS artifacts
        # An empty CSC_LINK makes electron-builder resolve "" against the
        # project dir and fail with "<projectDir> not a file". Unset the
        # signing vars when the corresponding secrets aren't configured so
        # the build falls back cleanly to an unsigned (ad-hoc) bundle.
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  windows:
    name: Windows (NSIS installer, portable .exe)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build and publish Windows artifacts
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notes:
    name: Tidy draft release (notes + assets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # electron-builder (any of the three jobs) creates the draft release;
    # wait for all so the edit can't race the creation.
    needs: [linux, mac, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags — the generator diffs against the previous tag.
          fetch-depth: 0

      - name: Generate notes from conventional commits
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/notes.md

      - name: Write notes into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md

      - name: Prune auto-update artifacts from the draft
        # The app ships without auto-update, so the updater sidecar files
        # (.blockmap diffs, latest*.yml feeds, mac zips) are release clutter
        # that used to be deleted by hand. Restore these if auto-update is
        # ever adopted — electron-updater needs every one of them.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | { grep -Ei '\.zip$|\.blockmap$|^latest.*\.ya?ml$' || true; } \
            | while IFS= read -r asset; do
                echo "deleting $asset"
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
          echo "Remaining assets:"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
